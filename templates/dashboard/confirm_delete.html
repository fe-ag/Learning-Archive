{% extends "dashboard/base.html" %}
{% block title %}Delete {{ noun }}{% endblock %}
{% block content %}
<div class="panel form-card">
  <h1>Delete this {{ noun }}?</h1>
  <p>You are about to delete <strong>{{ object }}</strong>. This can’t be undone.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button class="btn btn-danger" type="submit">Delete {{ noun }}</button>
      <a class="btn btn-secondary" href="{{ cancel_url }}">Keep it</a>
    </div>
  </form>
</div>
{% endblock %}
